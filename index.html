<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Equipment Readiness & Commissioning Tracker</title>
  <link rel="stylesheet" href="./vendor/apk-contracts/apk-tokens.css">
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="./vendor/apk-table/apk-table.css">
  <style>
    .main-layout {
      display: flex;
      flex-direction: column;
      height: calc(100vh - 70px);
      padding: 16px;
      gap: 16px;
      box-sizing: border-box;
    }
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
    }
    .kpi-card {
      background: var(--surface-primary, #18181b);
      border: 1px solid var(--border-color, #2c2c2c);
      border-radius: 8px;
      padding: 12px 16px;
    }
    .kpi-label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted, #888888);
      margin-bottom: 4px;
    }
    .kpi-val {
      font-size: 22px;
      font-weight: 700;
      color: var(--text-bright, #f4f4f5);
      font-family: 'JetBrains Mono', monospace;
    }
    .progress-bar-container {
      background: var(--surface-bg, #121212);
      border-radius: 4px;
      height: 8px;
      width: 100%;
      overflow: hidden;
      margin-top: 8px;
      border: 1px solid var(--border-color, #2c2c2c);
    }
    .progress-bar-fill {
      background: #4ADE80;
      height: 100%;
      transition: width 0.3s ease;
    }
    .panel {
      background: var(--surface-primary, #18181b);
      border: 1px solid var(--border-color, #2c2c2c);
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      flex: 1;
    }
    .panel-header {
      padding: 12px 16px;
      background: var(--surface-secondary, #0f0f11);
      border-bottom: 1px solid var(--border-color, #2c2c2c);
      font-weight: 600;
      font-size: 13px;
      color: var(--text-bright, #f4f4f5);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .table-container {
      flex: 1;
      overflow: auto;
    }
    .inline-cell {
      background: rgba(255, 255, 255, 0.02);
      cursor: text;
    }
    .inline-cell:focus {
      outline: 1px solid var(--accent-orange, #F4902C);
      background: rgba(244, 144, 44, 0.1);
    }
    .stage-select {
      background: var(--surface-bg, #121212);
      border: 1px solid var(--border-color, #2c2c2c);
      border-radius: 4px;
      color: var(--text-bright, #f4f4f5);
      padding: 6px 8px;
      font-size: 12px;
      font-weight: 600;
      width: 100%;
    }
    .btn-delete {
      background: transparent;
      border: none;
      color: #FF5A5A;
      cursor: pointer;
      font-weight: bold;
      padding: 2px 6px;
      border-radius: 3px;
    }
    .btn-delete:hover {
      background: rgba(255, 90, 90, 0.2);
    }
    .discovered-panel { flex: 0 0 auto; max-height: 40vh; overflow: auto; margin-bottom: 12px; }
    .discovered-panel[hidden] { display: none; }
    [data-apk-state="good"] { color: var(--apk-state-good); }
    [data-apk-state="kinda"] { color: var(--apk-state-kinda); }
    [data-apk-state="dead"] { color: var(--apk-state-dead); }
  </style>
</head>
<body class="deep-horizon">
  <div class="window-header">
    <div class="window-title">
      <span class="window-icon">🚦</span>
      <span class="window-text">Equipment Staging & Commissioning Readiness</span>
      <span id="block-tag" class="block-tag">READINESS BLOCK</span>
    </div>
    <div class="window-actions">
      <input type="text" id="prop-planName" placeholder="Readiness Plan Name" style="background: var(--surface-bg); border: 1px solid var(--border-color); border-radius: 4px; padding: 4px 8px; color: var(--text-bright); font-size: 12px; width: 220px;">
      <button id="btn-open" class="btn-action">📂 Open Block</button>
      <button id="btn-discovered" class="btn-action" title="Show what is on the network (the bus), live">⚡ Discovered</button>
      <button id="btn-save" class="btn-action btn-primary">💾 Save & Return</button>
      <button id="btn-close" class="btn-action btn-close">✕</button>
    </div>
  </div>

  <div class="main-layout">
    <div class="kpi-grid">
      <div class="kpi-card">
        <div class="kpi-label">Completion Level</div>
        <div id="kpi-percent" class="kpi-val">0%</div>
        <div class="progress-bar-container">
          <div id="overall-progress-fill" class="progress-bar-fill" style="width: 0%;"></div>
        </div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">Bottleneck Stage (Min Rank)</div>
        <div id="kpi-stage" class="kpi-val">---</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">Assets In Flight</div>
        <div id="kpi-staged" class="kpi-val">0 / 0</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">Est. Time To Air</div>
        <div id="kpi-eta" class="kpi-val">---</div>
      </div>
    </div>

    <section id="discovered-panel" class="panel discovered-panel" hidden>
      <div class="panel-header">
        <span>On the network</span>
        <span id="discovered-status" class="discovered-status" data-apk-state="kinda">Not started.</span>
      </div>
      <div id="discovered-table"></div>
    </section>

    <div class="panel">
      <div class="panel-header">
        <span>Hardware Asset Commissioning Pipeline (d0 Unstaged → d8 Air Ready)</span>
        <div style="display: flex; gap: 8px;">
          <button id="btn-mark-all" class="btn-action btn-small" style="background: rgba(34, 197, 94, 0.2); border-color: #22c55e; color: #22c55e;">✓ Mark All Air Ready</button>
          <button id="btn-add-device" class="btn-action btn-small" data-apk-library>📚 Library</button>
        </div>
      </div>

      <div class="table-container">
        <div id="device-table"></div>
      </div>
    </div>
  </div>

  <script src="./vendor/apk-contracts/apk-contracts.global.js"></script>
  <script src="/FrontEnd/shared/apk-bus.js"></script>
  <script src="./vendor/apk-softapp/apk-softapp.js"></script>
  <script src="./vendor/apk-table/apk-table.js"></script>
  <script type="module" src="js/readinessApp.js"></script>
</body>
</html>
